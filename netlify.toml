[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # webpack 4 (vue-cli 4) needs the legacy OpenSSL provider on Node 17+
  NODE_OPTIONS = "--openssl-legacy-provider"
  # npm 7+ strict peer resolution rejects the vue-cli 4 / vue2-frappe ranges;
  # yarn.lock installs cleanly, so have Netlify install with yarn
  NETLIFY_USE_YARN = "true"
